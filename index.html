<!DOCTYPE html>
<html lang="de">
<head>

<title>T Metrik – OAuth Callback</title>
<style>
  body { background:#0b0f14; color:#e6edf3; font-family:system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px;
          padding:32px 40px; max-width:480px; text-align:center; }
  h1 { font-size:20px; margin:0 0 12px; }
  p  { color:#8b949e; font-size:14px; line-height:1.6; margin:0; }
  .ok { color:#3fb950; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <h1>T Metrik · OAuth-Callback</h1>
  <p><span class="ok">Alles in Ordnung.</span><br>
  Diese App nutzt die Tesla Vehicle Device API mit
  <em>client_credentials</em> (Server-zu-Server) – es findet kein
  Browser-Login statt. Diese Seite dient nur als zulässige
  Herkunfts-URL / Weiterleitungs-URL für die Tesla-Developer-Anmeldung
  (App „T Metrik").</p>
</div>
